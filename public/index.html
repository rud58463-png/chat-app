<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAM9dWJ2EQlJbESwB5FSxb4Q_OH2OG0G1k",
      authDomain: "chat-app-rudjiroad.firebaseapp.com",
      projectId: "chat-app-rudjiroad",
      storageBucket: "chat-app-rudjiroad.firebasestorage.app",
      messagingSenderId: "441617353213",
      appId: "1:441617353213:web:dafe971e2e3a7b6d1a7194"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    
    auth.setPersistence(firebase.auth.Auth.Persistence.INDEXEDDB).catch(err => console.log("Persistence Error ignored"));

    let idToken = "";
    let userData = {
      name: "rudjiroad 123",
      avatar: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };
    let lastTime = Date.now() - 30000;

    // ตรวจจับสถานะ Auth จาก Google
    auth.onAuthStateChanged(async user => {
      if (user) {
        userData = {
          name: user.displayName || "rudjiroad 123",
          uid: user.uid,
          avatar: user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png"
        };
        idToken = await user.getIdToken();
        
        // แก้ไข: แสดงแค่ชื่อผู้ใช้โดยตัดคำว่า "👋 สวัสดี" ออกไปเลย
        document.getElementById("showName").textContent = userData.name;
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("chatPage").style.display = "flex";
        joinChat();
      } else {
        document.getElementById("loginPage").style.display = "block";
        document.getElementById("chatPage").style.display = "none";
        
        auth.getRedirectResult().catch(err => {
          console.log("Redirect check status:", err.message);
        });
      }
    });

    let loginInProgress = false;

    function loginGoogle() {
      if (loginInProgress) return;
      loginInProgress = true;
      document.getElementById("btnGoogle").disabled = true;
      
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    }

    function xhr(method, url, data, cb) {
      const x = new XMLHttpRequest();
      x.open(method, url, true);
      x.timeout = 5000;
      x.setRequestHeader("Authorization", `Bearer ${idToken}`);
      if (method === "POST") x.setRequestHeader("Content-Type", "application/json");
      x.onreadystatechange = function() {
        if (x.readyState === 4) {
          try { cb(JSON.parse(x.responseText)); } catch(e) { cb(null); }
        }
      };
      x.onerror = () => cb(null);
      x.send(data ? JSON.stringify(data) : null);
    }

    function joinChat() {
      // ใช้ชื่อผู้ใช้จริงแทนการสุ่ม ID แปลกๆ
      xhr("POST", "/join", { id: userData.name }, res => {
        if (res && res.ok) {
          startPolling();
        } else {
          alert("เข้าห้องแชทไม่ได้เนื่องจาก: " + (res?.reason || "เซิร์ฟเวอร์ขัดข้อง"));
        }
      });
    }

    function sendMsg() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      // ส่งข้อความพร้อมชื่อและรูปโปรไฟล์จริงเข้าเซิร์ฟเวอร์ (ตัดระบบ AI ออกเรียบร้อย)
      xhr("POST", "/chat", { 
        id: userData.name, 
        text: text, 
        profile: userData.avatar 
      }, res => {
        if (!res || !res.ok) {
          alert("ส่งข้อความไม่สำเร็จ");
        }
      });
    }

    function poll() {
      xhr("GET", `/poll?id=${encodeURIComponent(userData.name)}&since=${lastTime}`, null, data => {
        if (!data) return;
        if(data.online) document.getElementById("onlineCount").textContent = data.online;

        if (data.messages && data.messages.length > 0) {
          const box = document.getElementById("chatMessages");
          
          data.messages.forEach(m => {
            const isMe = (m.username === userData.name);
            const wrapper = document.createElement("div");
            wrapper.className = `message-wrapper ${isMe ? 'me' : 'other'}`;
            
            const timeStr = new Date(m.time).toLocaleTimeString("th-TH", {hour:'2-digit', minute:'2-digit'});
            const profileImg = m.profile || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

            wrapper.innerHTML = `
              <img class="avatar" src="${profileImg}" alt="profile">
              <div class="message-content">
                <span class="message-username">${m.username}</span>
                <div class="bubble">${m.text}</div>
                <span class="msg-time">${timeStr}</span>
              </div>
            `;
            
            box.appendChild(wrapper);
            box.scrollTop = box.scrollHeight;
            if (m.time > lastTime) lastTime = m.time;
          });
        }
      });
    }

    function startPolling() {
      poll();
      setInterval(poll, 1500);
    }

    document.getElementById("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
